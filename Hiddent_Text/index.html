<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Announcement</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e9e4d8;
    font-family: Arial, sans-serif;
}

.paper {
    width: 90%;
    max-width: 420px;
    background: #fffdf7;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    border: 1px solid #d6d0c4;
    position: relative;
}

.paper::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.03),
        rgba(0,0,0,0.03) 1px,
        transparent 3px
    );
    pointer-events: none;
}

h2 {
    text-align: center;
    font-size: 18px;
    margin-bottom: 15px;
}

p {
    font-size: 13px;
    line-height: 1.6;
    color: #333;
}

.notice {
    margin-top: 12px;
    padding: 8px;
    border: 1px dashed #bbb;
    font-size: 12px;
}

.hint {
    font-size: 12px;
    color: #666;
    font-style: italic;
}

.stamp {
    position: absolute;
    bottom: 15px;
    right: 15px;
    transform: rotate(-10deg);
    border: 2px solid #b91c1c;
    color: #b91c1c;
    font-size: 10px;
    padding: 3px 5px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="paper">

<h2>📢 Student Announcement</h2>

<p>
Please be informed that system maintenance will be conducted tonight.
</p>

<div class="notice">
Reminder: Always refer to official system channels for updates.
</div>

<p>
Students are advised to follow instructions carefully.
</p>

<p class="hint">
Some system endpoints may not be linked in the interface.
</p>

<div class="stamp">VERIFIED</div>

</div>

</body>
</html>
