<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberStore Wallet Checkout</title>

<style>
body {
    margin: 0;
    background: #0b1220;
    font-family: Arial;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: white;
}

.container {
    width: 100%;
    max-width: 480px;
    background: #111827;
    border-radius: 12px;
    padding: 15px;
}

h2 {
    color: #38bdf8;
}

.wallet {
    background: #020617;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 14px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    background: #1f2937;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.price {
    color: #22c55e;
}

.voucher-list {
    margin-top: 10px;
}

.voucher-card {
    background: linear-gradient(135deg, #1f2937, #0f172a);
    padding: 10px;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 12px;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    background: #020617;
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    color: white;
}

.apply { background: #3b82f6; }
.pay { background: #ef4444; }

.msg {
    margin-top: 10px;
    font-size: 13px;
    white-space: pre-wrap;
    color: #fbbf24;
}
</style>
</head>

<body>

<div class="container">

<h2>🛒 CyberStore Checkout</h2>

<div class="wallet">
💰 Wallet Balance: <b>RM 0.00</b>
</div>

<div class="cart-item">
    <span>Cyber Security Training Pack</span>
    <span class="price">RM 100.00</span>
</div>

<div class="voucher-list">

<div class="voucher-card">
🎟️ Voucher A  
Code: Y3liZXJvcHMyMA==  
(20% Discount)
</div>

<div class="voucher-card">
🎟️ Voucher B  
Code: Y3liZXJvcHM1MA==  
(50% Discount)
</div>

</div>

<input id="voucher" placeholder="Enter voucher code">

<button class="apply" onclick="applyVoucher()">Apply Voucher</button>
<button class="pay" onclick="payNow()">Pay Now</button>

<div class="msg" id="msg"></div>

</div>

<script src="script.js"></script>
</body>
</html>
