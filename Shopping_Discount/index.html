<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberStore Checkout System</title>

<style>
body {
    margin: 0;
    background: #0b1220;
    font-family: Arial;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: white;
}

.container {
    width: 100%;
    max-width: 460px;
    background: #111827;
    padding: 15px;
    border-radius: 12px;
}

h2 {
    color: #38bdf8;
    font-size: 16px;
}

.card {
    background: #1f2937;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    font-size: 13px;
}

.voucher {
    background: #0f172a;
    padding: 8px;
    margin-top: 8px;
    border-radius: 6px;
    font-size: 12px;
    word-break: break-all;
    color: #22c55e;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #0f172a;
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

.apply {
    background: #3b82f6;
}

.pay {
    background: #ef4444;
}

.msg {
    margin-top: 10px;
    font-size: 13px;
    color: #fbbf24;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h2>🛒 CyberStore Secure Checkout</h2>

<div class="card">
Item: Cyber Security Training Pack<br>
Price: RM 100.00
</div>

<div class="card">
📦 Available Vouchers (Base64 Encoded)
</div>

<div class="voucher">
cyberops20 → Y3liZXJvcHMyMA==
</div>

<div class="voucher">
cyberops50 → Y3liZXJvcHM1MA==
</div>

<div class="card">
⚠ Only full discount voucher allows free checkout approval.
</div>

<input id="voucher" placeholder="Enter Base64 voucher">

<button class="apply" onclick="applyVoucher()">Apply Voucher</button>

<button class="pay" onclick="payNow()">PAY NOW</button>

<div class="msg" id="msg"></div>

</div>

<script>
let price = 100;
let discount = 0;

function decodeBase64(str){
    try {
        return atob(str);
    } catch(e){
        return null;
    }
}

function applyVoucher(){
    let v = document.getElementById("voucher").value.trim();
    let decoded = decodeBase64(v);

    if(decoded === "cyberops20"){
        discount = 20;
        updatePrice();
        return;
    }

    if(decoded === "cyberops50"){
        discount = 50;
        updatePrice();
        return;
    }

    if(decoded === "cyberops100"){
        discount = 100;
        updatePrice();
        document.getElementById("msg").innerHTML =
        "Full discount detected. Ready for checkout.";
        return;
    }

    document.getElementById("msg").innerHTML =
    "Invalid voucher.";
}

function updatePrice(){
    let final = price - (price * discount / 100);
    document.getElementById("msg").innerHTML =
    "Current discount: " + discount + "%\nFinal price: RM " + final.toFixed(2);
}

function payNow(){
    let final = price - (price * discount / 100);

    if(discount === 100 && final === 0){
        document.getElementById("msg").innerHTML =
        "🎉 PAYMENT SUCCESS (FREE)\nFLAG: SMKBBS{CYBEROPS100_PAYMENT_UNLOCK}";
    } else {
        document.getElementById("msg").innerHTML =
        "❌ Payment failed: Full discount required.";
    }
}
</script>

</body>
</html>
