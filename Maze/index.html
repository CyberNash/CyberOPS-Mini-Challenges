<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Maze CTF</title>

<style>
body {
    margin: 0;
    background: #0b0f1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    font-family: Arial;
    color: white;
}

canvas {
    background: #111827;
    border: 2px solid #1f2937;
    max-width: 95vw;
    max-height: 60vh;
}

.controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    gap: 10px;
}

button {
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 10px;
    background: #1f2937;
    color: white;
    font-size: 18px;
}

button:active {
    transform: scale(0.95);
}

.flag {
    margin-top: 10px;
    color: #22c55e;
    display: none;
    text-align: center;
}

.meme {
    position: absolute;
    font-size: 24px;
    color: yellow;
    display: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="controls">
    <div></div>
    <button onclick="move('up')">⬆</button>
    <div></div>

    <button onclick="move('left')">⬅</button>
    <button onclick="move('down')">⬇</button>
    <button onclick="move('right')">➡</button>
</div>

<div class="flag" id="flag"></div>
<div class="meme" id="meme">😂 TOO CLOSE!</div>

<script src="script.js"></script>

</body>
</html>
