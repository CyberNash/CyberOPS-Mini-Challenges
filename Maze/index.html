<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Maze CTF</title>

<style>
body {
    margin: 0;
    background: #0b0f1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    font-family: Arial;
    color: white;
    overflow: hidden;
    touch-action: none;
}

canvas {
    background: #111827;
    border: 2px solid #1f2937;
    image-rendering: pixelated;
    max-width: 95vw;
    max-height: 60vh;
}

/* JOYSTICK */
.joystick-area {
    margin-top: 15px;
    display: flex;
    justify-content: center;
}

.joystick {
    width: 120px;
    height: 120px;
    background: #1f2937;
    border-radius: 50%;
    position: relative;
    touch-action: none;
}

.stick {
    width: 50px;
    height: 50px;
    background: #3b82f6;
    border-radius: 50%;
    position: absolute;
    top: 35px;
    left: 35px;
}

/* FLAG */
.flag {
    margin-top: 10px;
    color: #22c55e;
    display: none;
    font-size: 16px;
    text-align: center;
}

/* MEME */
.meme {
    position: absolute;
    font-size: 26px;
    color: yellow;
    display: none;
    text-align: center;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="joystick-area">
    <div class="joystick" id="joystick">
        <div class="stick" id="stick"></div>
    </div>
</div>

<div class="flag" id="flag"></div>
<div class="meme" id="meme">😂 TOO CLOSE!</div>

<script src="script.js"></script>

</body>
</html>
