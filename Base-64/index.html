<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Log Viewer</title>

<style>
body {
    margin: 0;
    background: #0b1220;
    font-family: monospace;
    color: #cbd5e1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.terminal {
    width: 92%;
    max-width: 420px;
    background: #0f172a;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    overflow: hidden;
}

.header {
    color: #22c55e;
    margin-bottom: 10px;
    font-size: 14px;
}

.log {
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.info { color: #60a5fa; }
.warn { color: #facc15; }
.err  { color: #f87171; }
.sys  { color: #34d399; }
</style>
</head>

<body>

<div class="terminal">
    <div class="header">
SYSTEM LOG VIEWER v2.4.1
NODE: AUTH-SERVER-03
STATUS: ONLINE
    </div>

    <div class="log" id="logBox">
Loading logs...
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
