<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Call</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #075e54;
    font-family: Arial, sans-serif;
}

.call {
    width: 92%;
    max-width: 360px;
    height: 600px;
    background: linear-gradient(#075e54, #054d44);
    border-radius: 25px;
    color: white;
    text-align: center;
    padding: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
    position: relative;
}

.avatar {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: #0f172a;
    margin: 30px auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.name {
    font-size: 18px;
    font-weight: bold;
}

.status {
    font-size: 12px;
    color: #d1fae5;
    margin-top: 5px;
}

/* number display (not editable) */
.display {
    margin-top: 20px;
    font-size: 18px;
    letter-spacing: 2px;
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 10px;
}

/* keypad */
.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.key {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    transition: 0.1s;
}

.key:active {
    transform: scale(0.95);
}

/* buttons */
.call-btn {
    margin-top: 15px;
    padding: 10px 16px;
    border: none;
    border-radius: 20px;
    background: #25d366;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* result */
.result {
    margin-top: 15px;
    display: none;
    font-size: 14px;
}

.success { color: #25d366; }
.fail { color: #ff4d4d; }

.hint {
    position: absolute;
    bottom: 10px;
    font-size: 11px;
    color: #d1fae5;
    left: 10px;
    right: 10px;
}
</style>
</head>

<body>

<div class="call">

<div class="avatar">👤</div>
<div class="name">CyberOPS President</div>
<div class="status">Ringing...</div>

<div class="display" id="display"></div>

<div class="keypad">
    <div class="key" onclick="addNum('1')">1</div>
    <div class="key" onclick="addNum('2')">2</div>
    <div class="key" onclick="addNum('3')">3</div>
    <div class="key" onclick="addNum('4')">4</div>
    <div class="key" onclick="addNum('5')">5</div>
    <div class="key" onclick="addNum('6')">6</div>
    <div class="key" onclick="addNum('7')">7</div>
    <div class="key" onclick="addNum('8')">8</div>
    <div class="key" onclick="addNum('9')">9</div>
    <div class="key" onclick="clearNum()">⌫</div>
    <div class="key" onclick="addNum('0')">0</div>
    <div class="key" onclick="addNum('*')">*</div>
</div>

<button class="call-btn" onclick="call()">📞 CALL</button>

<div id="ok" class="result success">
FLAG: SMKBBS{WH4T54PP_D14L_5UCC355}
</div>

<div id="no" class="result fail">
❌ Call Declined
</div>

<div class="hint">
Hint: Call the UniMAP CyberOPS Club President
</div>

</div>

<script>
let number = "";

function addNum(n) {
    number += n;
    document.getElementById("display").innerText = number;
}

function clearNum() {
    number = number.slice(0, -1);
    document.getElementById("display").innerText = number;
}

function call() {
    document.getElementById("ok").style.display = "none";
    document.getElementById("no").style.display = "none";

    if (number === "0174604344") {
        document.getElementById("ok").style.display = "block";
    } else {
        document.getElementById("no").style.display = "block";
    }
}
</script>

</body>
</html>
