<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login Panel</title>

<style>
body {
    margin: 0;
    background: #0b1220;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.box {
    width: 320px;
    background: #111827;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

h2 {
    font-size: 16px;
    color: #38bdf8;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #1f2937;
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

.msg {
    margin-top: 10px;
    font-size: 13px;
}

.hint {
    margin-top: 10px;
    font-size: 11px;
    color: #9ca3af;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 ADMIN LOGIN PANEL</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div class="msg" id="msg"></div>

<div class="hint">
Hint: The system is not as secure as it looks...
</div>

<!-- FLAG IS HERE (WEBN LEARNING OBJECT) -->
<script>
const secretUser = "admin";
const secretPass = "cyberops";

function login(){
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === secretUser && p === secretPass){
        document.getElementById("msg").innerHTML =
        "ACCESS GRANTED: SMKBBS{CL13NT_S1D3_BR0K3N_53CUR1TY}";
    } else {
        document.getElementById("msg").innerHTML =
        "ACCESS DENIED: Invalid credentials";
    }
}
</script>

</div>

</body>
</html>
